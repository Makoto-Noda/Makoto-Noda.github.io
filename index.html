<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>つくったもの</title>
<meta name="description" content="ブラウザで遊べるゲームや小さな道具の置き場。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 1カラムの棚。作品は「サムネイル＋説明」の横長カードで縦に積み、増えても同じ形で並ぶ */
:root {
  --bg: #f1f3ea;
  --surface: #ffffff;
  --ink: #26301f;
  --ink-soft: #5f6a57;
  --line: rgba(38, 48, 31, 0.12);
  --accent: #e29a14;
  --accent-ink: #ffffff;
  --leaf: #5d8a3c;
  --display: "Mochiy Pop One", "Hiragino Maru Gothic ProN", "Zen Maru Gothic", sans-serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 500 15px/1.7 var(--body);
}
.wrap {
  max-width: 880px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 48px) 16px calc(env(safe-area-inset-bottom, 0px) + 48px);
  display: grid; gap: 36px;
}
header { display: grid; gap: 6px; }
h1 { margin: 0; font: 400 clamp(28px, 6vw, 40px)/1.2 var(--display); text-wrap: balance; }
header p { margin: 0; color: var(--ink-soft); }
.label { font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--leaf); }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.work {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  text-decoration: none; color: inherit;
  transition: transform .18s ease, box-shadow .18s ease;
}
.work:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(30, 40, 20, 0.14); }
.work:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.thumb { aspect-ratio: 16 / 9; max-width: 100%; background: var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.info { padding: 20px 22px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.info h2 { margin: 0; font: 400 22px/1.3 var(--display); }
.info p { margin: 0; color: var(--ink-soft); font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--ink-soft);
}
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.play {
  justify-self: start; margin-top: 4px;
  font: 400 15px/1 var(--display); color: var(--accent-ink); background: var(--accent);
  padding: 11px 18px; border-radius: 12px;
}
footer { color: var(--ink-soft); font-size: 12.5px; }

@media (max-width: 640px) {
  .wrap { padding-top: calc(env(safe-area-inset-top, 0px) + 32px); gap: 28px; }
  .work { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .work, .work:hover { transition: none; transform: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="label">WORKS</div>
    <h1>つくったもの</h1>
    <p>ブラウザでそのまま遊べるゲームや、小さな道具を置いています。</p>
  </header>

  <main>
    <ul class="list">
      <li>
        <a class="work" href="nekomichi/">
          <div class="thumb"><img src="nekomichi/thumb.jpg" alt="崖と縁側にはさまれた庭に石のブロックが並び、黒白の猫と金色の魚が置かれたゲーム画面" width="960" height="541" loading="lazy"></div>
          <div class="info">
            <h2>ねこみちパズル</h2>
            <div class="tags"><span class="tag">3D</span><span class="tag">パズル</span><span class="tag">ねこ</span></div>
            <p>限られたブロックを積んで道を作り、タキシード猫をフードとゴールの魚まで導くパズル。猫は距離に応じて登れる高さと降りられる高さが決まっています。</p>
            <div class="meta"><span>全10ステージ</span><span>パソコン・スマホ対応</span><span>更新 2026-10-10</span></div>
            <span class="play">遊ぶ →</span>
          </div>
        </a>
      </li>
    </ul>
  </main>

  <footer>記録は遊んでいる端末のブラウザに保存されます。</footer>
</div>
</body>
</html>
